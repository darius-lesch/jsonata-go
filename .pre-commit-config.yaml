# ==========================================
# pre-commit framework configurations
# ==========================================

repos:
  # ==========================================
  # COMMIT MESSAGE VALIDATION
  # ==========================================
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  # ==========================================
  # PRE-COMMIT GENERAL REPOSITORY SANITIZATION
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
        exclude: ^deploy/helm/.*/templates/.*\.yaml$
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  # Official golangci-lint hook
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        args: [--timeout=5m]
        stages: [pre-commit]

  # 4. Local hooks for Go toolchain
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: go fmt ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-commit]

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # ==========================================
  # PRE-PUSH & PRE-MERGE
  # ==========================================
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push, pre-merge-commit]
